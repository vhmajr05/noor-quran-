<style>
:root{color-scheme:dark;--bg:#10100F;--bg2:#171715;--card:#1E1D1A;--raise:#26241F;--gold:#D5B875;--gold2:#E8D8A9;--ink:#F5F0E6;--mute:#BDB6A7;--line:#39352B;--field:#7C766A;--r:16px;--r2:12px;--s1:.5rem;--s2:1rem;--s3:1.5rem;--nav:64px;--rail:0px;--sz:1.9rem;--ease:cubic-bezier(.2,.7,.2,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}.f{fill:currentColor}
:focus-visible{outline:3px solid var(--gold2);outline-offset:2px}

#nav a[aria-current=page]::before{content:"";position:absolute;top:0;width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--gold)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:var(--s2);margin-bottom:var(--s2);animation:rise .28s var(--ease) both}
a.card{display:block;color:inherit;text-decoration:none;transition:border-color .15s}a.card:hover,.it:hover{border-color:#5a5547}
.hero{background:var(--raise);border-color:#4a4538}.mute{color:var(--mute);margin:.2rem 0}.row{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}

.b{display:inline-flex;align-items:center;gap:.45rem;cursor:pointer;text-decoration:none}.b:hover,.ic:hover{border-color:var(--gold)}.b:active,.ic:active{transform:scale(.97)}
.b.p{background:var(--gold);border-color:var(--gold);color:#10100F;font-weight:600}.b.p:hover{background:var(--gold2)}.b.ghost{background:transparent}

.ic{min-width:44px;display:inline-grid;place-items:center;padding:.2rem;cursor:pointer}.ic.on{color:var(--gold);border-color:var(--gold);background:rgba(213,184,117,.12)}.ic.on svg{fill:currentColor}

.bar i,.pbar i{display:block;height:100%;background:var(--gold);border-radius:3px;transition:width .6s var(--ease)}
.ar{font-family:'Amiri Quran','Traditional Arabic',serif;font-size:var(--sz);line-height:2.2;text-align:right;margin:.4rem 0;color:var(--ink)}

.v{padding:var(--s2) .5rem;border-bottom:1px solid var(--line);border-left:3px solid transparent;scroll-margin-top:80px;transition:background .2s}.v.on{background:rgba(213,184,117,.08);border-left-color:var(--gold)}
.vh{display:flex;justify-content:space-between;align-items:center}.acts{display:flex;gap:.3rem}

.load{display:flex;gap:.6rem;align-items:center;color:var(--mute);padding:var(--s3) 0}.load i{width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite}
#player{position:fixed;left:calc(var(--rail) + .5rem);right:.5rem;bottom:calc(var(--nav) + .5rem + env(safe-area-inset-bottom));z-index:6;background:var(--raise);border:1px solid var(--line);border-radius:var(--r);padding:.5rem .75rem;display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;box-shadow:0 6px 20px rgba(0,0,0,.45)}
#pp{background:var(--gold);border-color:var(--gold);color:#10100F}#pl{flex:1;min-width:8rem}.sb{font-size:.9rem;color:var(--mute)}
#status{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav) + 170px + env(safe-area-inset-bottom));z-index:9;background:var(--raise);border:1px solid var(--gold);padding:.55rem 1rem;border-radius:999px;font-size:.9rem;max-width:90vw;animation:rise .2s both}#status:empty{display:none}
dialog{background:var(--raise);color:var(--ink);border:1px solid var(--line);border-radius:var(--r);padding:var(--s2);max-width:min(92vw,420px)}dialog::backdrop{background:rgba(0,0,0,.65)}dialog p{margin:0 0 var(--s2)}dialog .row{justify-content:flex-end}
body{background:radial-gradient(900px 420px at 50% -80px,rgba(213,184,117,.07),transparent 70%) no-repeat,var(--bg)}
.ar{font-family:var(--arf,'Amiri Quran','Noto Naskh Arabic','Traditional Arabic',serif);line-height:2.35;word-spacing:.08em;text-rendering:optimizeLegibility;font-variant-ligatures:normal}
#flt{width:100%}.mute a{display:inline-block;padding:.7rem 0}

#pp{width:52px;height:52px;border-radius:50%}#pl{display:inline-flex;align-items:center;gap:.4rem}

input[type=radio],input[type=checkbox]{width:22px;height:22px;flex:none}input[type=range]{width:100%;height:32px}
.opt{display:flex;gap:.8rem;align-items:center;min-height:48px;cursor:pointer}fieldset.card{min-width:0;margin-left:0;margin-right:0}legend{padding:0 .3rem}
#pg{position:absolute;left:14px;right:14px;top:0;height:3px;background:var(--line);border-radius:0 0 3px 3px;overflow:hidden}#pg i{display:block;height:100%;width:0;background:var(--gold)}#player{padding-top:.8rem}#pl{flex:1 1 7rem;min-width:0;line-height:1.3}
@keyframes rise{from{opacity:0;transform:translateY(6px)}}@keyframes spin{to{transform:rotate(360deg)}}
@media(min-width:900px){:root{--rail:96px;--nav:0px}main{max-width:1000px}#nav{top:0;right:auto;width:var(--rail);flex-direction:column;justify-content:flex-start;padding:5rem 8px 0;border-top:0;border-right:1px solid var(--line)}#player{bottom:.5rem}#status{bottom:90px}body{padding-bottom:110px}#ls{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}#nav a[aria-current=page]::before{top:12px;bottom:12px;left:0;width:3px;height:auto;border-radius:0 3px 3px 0}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

<header><h1><svg class="i" aria-hidden="true" focusable="false"><use href="#i-moon"/></svg> Noor Quran</h1></header>
<main id="app" tabindex="-1"></main>

 <button class="ic" id="pv" aria-label="Verset précédent"><svg class="i f" aria-hidden="true" focusable="false"><use href="#i-prev"/></svg></button><button class="ic" id="pp" aria-label="Lecture / pause"><svg class="i f" aria-hidden="true" focusable="false"><use href="#i-pause"/></svg></button><button class="ic" id="nx" aria-label="Verset suivant"><svg class="i f" aria-hidden="true" focusable="false"><use href="#i-next"/></svg></button>
 <button class="ic" id="st" aria-label="Arrêter la lecture"><svg class="i f" aria-hidden="true" focusable="false"><use href="#i-stop"/></svg></button><span id="pl"></span><button class="b" id="rt" hidden>Réessayer</button><label class="sb" for="rec">Récitateur</label><select id="rec"></select>

<script>
const API='https://api.alquran.cloud/v1',Q2='https://api.quran.com/api/v4';
const $=(s,e=document)=>e.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store={get(k,d){try{return JSON.parse(localStorage.getItem('nq:'+k))??d}catch{return d}},set(k,v){try{localStorage.setItem('nq:'+k,JSON.stringify(v))}catch{}}};
let cfg={tr:'fr.hamidullah',rec:'ar.alafasy',size:1.9,showTr:true,mode:'auto',font:'quran',speed:1,...store.get('cfg',{})},META=[],reads=store.get('reads',{}),cur=0;
const saveCfg=()=>store.set('cfg',cfg),say=m=>{const s=$('#status');s.textContent=m;clearTimeout(say.t);say.t=setTimeout(()=>{s.textContent=''},4500)};
const ico=(n,f)=>`<svg class="i${f?' f':''}" aria-hidden="true" focusable="false"><use href="#i-${n}"/></svg>`,ppI=p=>{$('#pp').innerHTML=ico(p?'pause':'play',1);if('mediaSession'in navigator)navigator.mediaSession.playbackState=p?'playing':'paused'};
const ask=m=>new Promise(r=>{const d=$('#dlg');if(!d.showModal)return r(confirm(m));$('#dm').textContent=m;d.onclose=()=>r(d.returnValue==='ok');d.showModal()});
const clean=()=>{if(!['stop','auto'].includes(cfg.mode))cfg.mode='auto';if(!['quran','naskh'].includes(cfg.font))cfg.font='quran';cfg.size=Math.min(3.2,Math.max(1.2,+cfg.size||1.9));cfg.speed=[0.75,1,1.25,1.5].includes(+cfg.speed)?+cfg.speed:1};clean();
const apply=()=>{const s=document.documentElement.style;s.setProperty('--sz',cfg.size+'rem');s.setProperty('--arf',cfg.font==='naskh'?"'Noto Naskh Arabic','Amiri Quran',serif":"'Amiri Quran','Noto Naskh Arabic',serif")};
// --- stockage local (IndexedDB) : textes et audio hors ligne
const db=new Promise((ok,ko)=>{const r=indexedDB.open('noor',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>ok(r.result);r.onerror=()=>ko(r.error)});
const idb=async(m,f)=>{const d=await db;return new Promise((ok,ko)=>{const t=d.transaction('kv',m),q=f(t.objectStore('kv'));t.oncomplete=()=>ok(q&&q.result);t.onerror=()=>ko(t.error)})};
const kvGet=k=>idb('readonly',s=>s.get(k)),kvSet=(k,v)=>idb('readwrite',s=>s.put(v,k));
const fj=async u=>{const c=new AbortController(),t=setTimeout(()=>c.abort(),10000);try{const r=await fetch(u,{signal:c.signal}),j=await r.json().catch(()=>({}));if(!r.ok||(j.code&&j.code!==200)||j.data===undefined){const e=new Error(j.status||r.status);e.code=j.code||r.status;throw e}return j.data}finally{clearTimeout(t)}};
const getJ=async(key,url)=>{try{const d=await fj(url);await kvSet(key,d).catch(()=>{});return d}catch(e){const c=await kvGet(key);if(c)return c;throw e}};
// --- texte arabe : normalisation, vérification d'intégrité (aucun verset n'est écrit dans ce code)
const MARK=/[\u0610-\u061A\u064B-\u065F\u0670\u06D6-\u06ED\u0640\u08D3-\u08FF]/,
 norm=s=>s.replace(new RegExp(MARK.source,'g'),'').replace(/[ٱأإآ]/g,'ا').replace(/ى/g,'ي').replace(/\s/g,'');
const sha=async s=>{const w=globalThis.crypto?.subtle;if(!w){let h=5381;for(const c of s)h=((h<<5)+h+c.codePointAt(0))>>>0;return 'djb2:'+h}return [...new Uint8Array(await w.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('')};
async function verify(n,vs){const m=[],exp=META[n-1]?.numberOfAyahs;
 if(exp&&vs.length!==exp)m.push(`Nombre de versets : ${vs.length} au lieu de ${exp}.`);
 vs.forEach((x,i)=>{if(x.v!==i+1)m.push(`Numérotation incohérente au verset ${i+1}.`);if(!x.a?.trim())m.push(`Verset ${x.v} vide.`)});
 const h=await sha(vs.map(x=>x.a).join('\n')),k='fp'+n,old=store.get(k);
 if(!old)store.set(k,h);else if(old!==h)m.push('L’empreinte SHA-256 diffère de celle enregistrée au premier chargement : texte modifié ou corrompu.');
 return m}
let _b;const basmala=async()=>{if(_b)return _b;let b=await kvGet('basmala').catch(()=>null);if(!b){b=(await loadSurah(1)).v[0].a;kvSet('basmala',b).catch(()=>{})}return _b=b};
function stripB(t,b){const ch=[...t],k=norm(b).length;let c=0,i=0;
 for(;i<ch.length&&c<k;i++)if(!MARK.test(ch[i])&&!/\s/.test(ch[i]))c++;
 if(norm(ch.slice(0,i).join(''))!==norm(b))return t;
 while(i<ch.length&&(MARK.test(ch[i])||/\s/.test(ch[i])))i++;return ch.slice(i).join('')}
async function loadSurah(n){const key=`t:${n}:${cfg.tr}`;let d=await kvGet(key).catch(()=>null);
 if(!d){const [a,t]=await fj(`${API}/surah/${n}/editions/quran-uthmani,${cfg.tr}`);
  d={v:a.ayahs.map((x,i)=>({v:x.numberInSurah,g:x.number,a:x.text,t:t.ayahs[i]?.text||''}))};await kvSet(key,d).catch(()=>{})}
 d.chk=await verify(n,d.v);return d}
async function cross(n){say('Comparaison avec Quran.com…');
 try{const d=await loadSurah(n),j=await(await fetch(`${Q2}/quran/verses/uthmani?chapter_number=${n}`)).json(),b=await basmala(),
  o=j.verses.map(x=>norm(x.text_uthmani)),bad=[];
  d.v.forEach((x,i)=>{const t=norm(i===0&&n!==1&&n!==9?stripB(x.a,b):x.a);if(t!==o[i])bad.push(x.v)});
  const ok=!bad.length&&o.length===d.v.length;
  app.insertAdjacentHTML('afterbegin',`<div class="${ok?'card':'warn'}" role="${ok?'status':'alert'}">${ok?'✓ Squelette consonantique identique à Quran.com ('+o.length+' versets).':'Écarts avec Quran.com aux versets : '+bad.join(', ')+'. Comparaison indicative (variantes typographiques possibles) ; consultez un mushaf de référence.'}</div>`)
 }catch(e){say('Vérification impossible (hors ligne ?).')}}
// --- listes : favoris, marque-pages
const L=k=>store.get(k,[]),has=(k,s,v)=>L(k).some(x=>x.s===s&&x.v===v);
function toggle(k,s,v){let l=L(k);const h=has(k,s,v);l=h?l.filter(x=>!(x.s===s&&x.v===v)):[...l,{s,v,t:Date.now()}];store.set(k,l);return !h}
function markRead(n,v){const r=reads[n]||(reads[n]=[]);if(!r.includes(v))r.push(v);store.set('reads',reads);store.set('last',{s:n,v,t:Date.now()})}
// --- audio
const au=new Audio();let Q=null;
// Récitateurs supplémentaires : fichiers verset par verset d'everyayah.com (noms de dossiers à valider en test ; si l'un échoue, l'app l'indique)
const EA=window.NOOR_NO_EA?[]:[['Ali_Jaber_64kbps','Ali Jaber'],['Abdullah_Matroud_128kbps','Abdullah Matroud'],['Maher_AlMuaiqly_64kbps','Maher Al-Muaiqly'],['Yasser_Ad-Dussary_128kbps','Yasser Ad-Dussary'],['Nasser_Alqatami_128kbps','Nasser Al-Qatami'],['Saood_ash-Shuraym_128kbps','Saud Ash-Shuraim'],['Hani_Rifai_192kbps','Hani Ar-Rifai'],['Salah_Al_Budair_128kbps','Salah Al-Budair']],p3=n=>String(n).padStart(3,'0');
const audioList=async n=>{if(cfg.rec.startsWith('ea:')){const f=cfg.rec.slice(3);return Array.from({length:META[n-1].numberOfAyahs},(_,i)=>({v:i+1,url:`https://everyayah.com/data/${f}/${p3(n)}${p3(i+1)}.mp3`}))}
 return(await getJ(`a:${n}:${cfg.rec}`,`${API}/surah/${n}/${cfg.rec}`)).ayahs.map(x=>({v:x.numberInSurah,url:String(x.audio).replace(/^http:/,'https:')}))};
async function play(n,v,t0){try{const items=await audioList(n);Q={n,items,i:Math.max(0,items.findIndex(x=>x.v===v)),seek:t0||0};if(useNative()){Q.native=true;nativeStart()}else start()}catch{say('Audio indisponible pour ce récitateur (ou hors ligne).')}}
let gen=0,curBlob=null,sleepAt=0,sleepMin=0,lastSave=0;
const pre=new Audio();pre.preload='auto'; // sert uniquement à précharger le verset suivant ; un seul lecteur joue (au)
