name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - run: npm test
      - run: npm run build:www
      - run: '[ -d android ] || npx cap add android'
      - run: node patch-android.js
      - run: mkdir -p assets && cp icon-only.png icon-foreground.png icon-background.png assets/
      - run: npx capacitor-assets generate --android
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: noor-quran-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
