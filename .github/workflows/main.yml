name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier les fichiers du projet
        run: |
          ls -la
          for f in index.html package.json capacitor.config.json build-www.js patch-android.js NoorAudioPlugin.java NoorAudioService.java MainActivity.java; do
            if [ ! -s "$f" ]; then echo "FICHIER MANQUANT OU VIDE : $f"; MANQUE=1; fi
          done
          if [ -n "$MANQUE" ]; then exit 1; fi
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - run: npm run build:www
      - run: '[ -d android ] || npx cap add android'
      - run: node patch-android.js
      - run: mkdir -p assets && (cp icon-only.png icon-foreground.png icon-background.png assets/ || true)
      - run: npx capacitor-assets generate --android || true
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: noor-quran-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
